<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Component convertisor</title>
<style>
  :root { --bg:#fff; --fg:#1f1f1f; --mut:#6b6b6b; --line:#d9d9d9; --acc:#7efff5; --accfg:#000; }
  body[data-theme="dark"] { --bg:#18181a; --fg:#eee; --mut:#a0a0a0; --line:#3a3a3d; }
  * { box-sizing: border-box; }
  body { margin:0; padding:12px; font:13px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  h1 { font-size:14px; margin:0 0 8px; }
  h2 { font-size:12px; margin:16px 0 6px; text-transform:uppercase; letter-spacing:.04em; color:var(--mut); }
  .mut { color:var(--mut); }
  .ligne { border:1px solid var(--line); border-radius:6px; padding:8px; margin-bottom:6px; }
  .nom { font-family:ui-monospace, monospace; font-size:12px; word-break:break-all; }
  .actuel { color:var(--mut); font-size:12px; margin:2px 0 6px; }
  .champs { display:flex; gap:6px; }
  select, input[type=text], input[type=number] { width:100%; padding:5px; border:1px solid var(--line); border-radius:4px; background:var(--bg); color:var(--fg); font:inherit; }
  .champs select { flex:2; } .champs input { flex:1; }
  label.radio { display:block; margin:4px 0; }
  button { margin-top:14px; padding:8px 14px; border:0; border-radius:6px; background:var(--acc); color:var(--accfg); font:inherit; font-weight:600; cursor:pointer; width:100%; }
  button:disabled { opacity:.5; cursor:default; }
  #msg { margin-top:10px; padding:8px; border-radius:6px; display:none; }
  #msg.ok { display:block; background:#1f6f3a33; } #msg.ko { display:block; background:#b0262633; }
  .row2 { display:flex; gap:6px; }
</style>
</head>
<body data-theme="light">
<h1>Component convertisor</h1>
<div id="vide" class="mut">Sélectionne un composant tokenisé (par exemple un bouton).</div>

<div id="app" hidden>
  <div class="mut">Sélection : <span id="sel"></span></div>

  <h2>1. Tokens à décliner</h2>
  <div id="liste"></div>
  <div class="mut" id="aucun" hidden>Aucun token de taille trouvé sur cette sélection.</div>

  <h2>2. Jeu de tokens</h2>
  <input type="text" id="nomSet" placeholder="Nom du jeu, ex. 03-Composants-Tablette">

  <h2>3. Thème</h2>
  <label class="radio"><input type="radio" name="mode" value="new" checked> Créer un nouveau thème</label>
  <div class="row2" id="blocNew">
    <input type="text" id="themeGroup" placeholder="Groupe (ex. appareil)">
    <input type="text" id="themeName" placeholder="Nom (ex. Tablette)">
  </div>
  <label class="radio"><input type="radio" name="mode" value="existing"> Utiliser un thème existant</label>
  <select id="themeExistant" disabled></select>

  <label class="radio" style="margin-top:10px"><input type="checkbox" id="activer" checked> Activer le thème après création</label>

  <button id="go">Créer la variante</button>
  <div id="msg"></div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  document.body.dataset.theme = params.get("theme") || "light";
  const $ = (id) => document.getElementById(id);
  let etat = null;

  function option(valeur, texte) {
    const o = document.createElement("option");
    o.value = valeur; o.textContent = texte; return o;
  }

  function rendre() {
    const vide = !etat || !etat.selection;
    $("vide").hidden = !vide;
    $("app").hidden = vide;
    if (vide) return;

    $("sel").textContent = etat.selection;
    const liste = $("liste");
    // On garde les choix en cours si la sélection n'a pas changé de tokens.
    const memo = {};
    liste.querySelectorAll(".ligne").forEach((l) => {
      memo[l.dataset.name] = { ref: l.querySelector("select").value, val: l.querySelector("input").value };
    });
    liste.textContent = "";
    $("aucun").hidden = etat.tokens.length > 0;

    for (const t of etat.tokens) {
      const l = document.createElement("div");
      l.className = "ligne"; l.dataset.name = t.name; l.dataset.type = t.type;
      const n = document.createElement("div"); n.className = "nom"; n.textContent = t.name;
      const a = document.createElement("div"); a.className = "actuel";
      a.textContent = t.type + " · actuel : " + t.resolu + "  (" + t.valeur + ")";
      const c = document.createElement("div"); c.className = "champs";
      const s = document.createElement("select");
      s.appendChild(option("", "— inchangé —"));
      (etat.candidats[t.type] || []).forEach((k) => {
        if (k.name !== t.name) s.appendChild(option("{" + k.name + "}", k.name + "  (" + k.resolu + ")"));
      });
      const i = document.createElement("input");
      i.type = "number"; i.placeholder = "valeur libre";
      if (t.type === "typography") i.disabled = true;
      const m = memo[t.name];
      if (m) { s.value = m.ref; i.value = m.val; }
      c.append(s, i);
      l.append(n, a, c);
      liste.appendChild(l);
    }

    const ex = $("themeExistant");
    ex.textContent = "";
    etat.themes.forEach((th) => ex.appendChild(option(th.id, (th.group ? th.group + " / " : "") + th.name)));
  }

  document.querySelectorAll("input[name=mode]").forEach((r) =>
    r.addEventListener("change", () => {
      const nouveau = document.querySelector("input[name=mode]:checked").value === "new";
      $("themeGroup").disabled = !nouveau; $("themeName").disabled = !nouveau;
      $("themeExistant").disabled = nouveau;
    })
  );

  $("go").addEventListener("click", () => {
    const tokens = [];
    $("liste").querySelectorAll(".ligne").forEach((l) => {
      const ref = l.querySelector("select").value;
      const val = l.querySelector("input").value;
      const valeur = val !== "" ? val : ref;
      if (valeur) tokens.push({ name: l.dataset.name, type: l.dataset.type, value: valeur });
    });
    // Jeux de base du thème : ceux qui contiennent les tokens d'origine.
    const setsSources = Array.from(new Set(etat.tokens.map((t) => t.set)));
    const mode = document.querySelector("input[name=mode]:checked").value;
    $("go").disabled = true;
    parent.postMessage({
      type: "appliquer",
      setName: $("nomSet").value.trim(),
      tokens,
      themeMode: mode,
      themeGroup: $("themeGroup").value.trim(),
      themeName: $("themeName").value.trim(),
      themeId: $("themeExistant").value,
      activer: $("activer").checked,
      setsSources,
    }, "*");
  });

  window.addEventListener("message", (e) => {
    const m = e.data;
    if (!m || !m.type) return;
    if (m.type === "etat") { etat = m; rendre(); }
    if (m.type === "fini") {
      $("go").disabled = false;
      const box = $("msg");
      box.className = m.ok ? "ok" : "ko";
      box.textContent = m.message;
    }
  });

  parent.postMessage({ type: "ready" }, "*");
</script>
</body>
</html>
